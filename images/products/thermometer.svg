    <rect x="160" y="115" width="60" height="40" rx="8" fill="#10b981"/>
    <text x="190" y="140" fill="white" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">36.6°C</text>
    <!-- Button -->
