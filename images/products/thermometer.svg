<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="th-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#th-bg)" rx="20"/>
  <g>
    <!-- Ergonomic Thermometer Body -->
    <path d="M150 90h80c10 0 20 10 20 20v50c0 15-10 25-20 30l-10 130h-40l-10-130c-10-5-20-15-20-30v-50c0-10 10-20 20-20z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Sensor Tip -->
