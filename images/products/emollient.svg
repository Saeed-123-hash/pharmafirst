<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="em-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="em-shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#em-bg)" rx="20"/>
  <g filter="url(#em-shadow)">
    <!-- Pump Dispenser Head -->
    <path d="M190 70h45v15h-45z" fill="#e2e8f0" stroke="#94a3b8"/>
    <path d="M165 75h30v8h-30z" fill="#cbd5e1"/>
    <path d="M195 85v25h10v-25z" fill="#cbd5e1"/>
    <!-- Bottle -->
    <rect x="125" y="110" width="150" height="220" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Minimalist Label -->
    <rect x="135" y="150" width="130" height="130" rx="8" fill="#fdf4ff"/>
    <text x="200" y="180" fill="#7c3aed" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">DERMAFIRST</text>
    <text x="200" y="205" fill="#1e1b4b" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Ceramide</text>
    <text x="200" y="222" fill="#6b21a8" font-family="sans-serif" font-size="12" text-anchor="middle">Emollient Cream</text>
    <line x1="160" y1="235" x2="240" y2="235" stroke="#e9d5ff" stroke-width="2"/>
    <text x="200" y="255" fill="#9333ea" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">400ml Care</text>
  </g>
</svg>