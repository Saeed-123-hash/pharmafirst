<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="bottle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="label-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="vit-shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#059669" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#vit-bg)" rx="20"/>
  <g filter="url(#vit-shadow)">
    <!-- Cap -->
    <rect x="150" y="60" width="100" height="35" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="160" y1="65" x2="160" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="175" y1="65" x2="175" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="190" y1="65" x2="190" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="205" y1="65" x2="205" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="220" y1="65" x2="220" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="235" y1="65" x2="235" y2="90" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Bottle Neck -->
    <rect x="160" y="95" width="80" height="15" fill="#f1f5f9"/>
    <!-- Main Bottle -->
    <rect x="120" y="110" width="160" height="210" rx="24" fill="url(#bottle-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Label -->
    <rect x="120" y="140" width="160" height="140" fill="url(#label-grad)"/>
    <text x="200" y="170" fill="white" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">VITAPURE</text>
    <text x="200" y="195" fill="#fef08a" font-family="sans-serif" font-weight="800" font-size="18" text-anchor="middle">DAILY MULTI</text>
    <text x="200" y="215" fill="white" font-family="sans-serif" font-size="11" text-anchor="middle">+ MINERALS &amp; ZINC</text>
    <rect x="150" y="235" width="100" height="22" rx="11" fill="white"/>
    <text x="200" y="250" fill="#047857" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">120 SOFTGELS</text>
  </g>
</svg>