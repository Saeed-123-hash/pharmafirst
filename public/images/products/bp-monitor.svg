<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="bp-shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bp-bg)" rx="20"/>
  <g filter="url(#bp-shadow)">
    <!-- Device Body -->
    <rect x="75" y="85" width="250" height="230" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Digital Screen -->
    <rect x="105" y="110" width="190" height="130" rx="14" fill="url(#screen-grad)"/>
    <text x="125" y="145" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="32">118</text>
    <text x="210" y="142" fill="#94a3b8" font-family="sans-serif" font-size="11">SYS mmHg</text>
    
    <text x="125" y="190" fill="#34d399" font-family="monospace" font-weight="bold" font-size="32">78</text>
    <text x="210" y="187" fill="#94a3b8" font-family="sans-serif" font-size="11">DIA mmHg</text>

    <text x="125" y="222" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="18">72</text>
    <text x="160" y="222" fill="#94a3b8" font-family="sans-serif" font-size="10">PULSE /min</text>
    
    <!-- Heart pulse icon -->
    <path d="M250 216c0-5 6-7 8-2 2-5 8-3 8 2 0 7-8 11-8 11s-8-4-8-11z" fill="#f43f5e"/>

    <!-- Power button -->
    <circle cx="160" cy="275" r="22" fill="#0284c7"/>
    <circle cx="160" cy="275" r="18" fill="#0369a1"/>
    <text x="145" y="280" fill="white" font-family="sans-serif" font-weight="bold" font-size="12">START</text>

    <circle cx="235" cy="275" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="223" y="279" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="10">MEM</text>
  </g>
</svg>