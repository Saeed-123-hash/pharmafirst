<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#p-bg)" rx="20"/>
  <g filter="url(#shadow)">
    <!-- Medicine Box -->
    <rect x="70" y="80" width="220" height="240" rx="12" fill="url(#box-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="80" width="220" height="45" rx="12" fill="url(#accent-grad)"/>
    <rect x="70" y="115" width="220" height="10" fill="url(#accent-grad)"/>
    <circle cx="100" cy="102" r="10" fill="white" opacity="0.9"/>
    <path d="M96 102h8M100 98v8" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="120" y="107" fill="white" font-family="sans-serif" font-weight="bold" font-size="14" letter-spacing="1">PHARMA FIRST</text>
    
    <text x="95" y="160" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="18">Paracetamol</text>
    <text x="95" y="180" fill="#0284c7" font-family="sans-serif" font-weight="bold" font-size="14">500mg Coated</text>
    <rect x="95" y="200" width="170" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="95" y="215" width="120" height="6" rx="3" fill="#f1f5f9"/>
    <rect x="95" y="230" width="140" height="6" rx="3" fill="#f1f5f9"/>

    <rect x="95" y="265" width="70" height="24" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="104" y="281" fill="#047857" font-family="sans-serif" font-weight="bold" font-size="10">100 TABS</text>
    
    <!-- Blister Pack Overlay -->
    <rect x="210" y="140" width="120" height="170" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" opacity="0.95"/>
    <rect x="210" y="140" width="120" height="170" rx="8" fill="url(#accent-grad)" opacity="0.08"/>
    <!-- Pills in blister -->
    <ellipse cx="240" cy="170" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="280" cy="170" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="240" cy="210" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="280" cy="210" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="240" cy="250" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="280" cy="250" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="240" cy="285" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="280" cy="285" rx="14" ry="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  </g>
</svg>