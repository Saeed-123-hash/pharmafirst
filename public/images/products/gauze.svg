<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="g-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0284c7" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#g-bg)" rx="20"/>
  <g filter="url(#g-shadow)">
    <!-- Sterile Pouch -->
    <rect x="90" y="70" width="220" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Peel-apart header -->
    <rect x="90" y="70" width="220" height="60" rx="14" fill="#0284c7"/>
    <rect x="90" y="120" width="220" height="10" fill="#0284c7"/>
    <!-- Medical Cross -->
    <circle cx="130" cy="100" r="16" fill="white"/>
    <path d="M125 100h10M130 95v10" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <text x="155" y="105" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">MEDSHIELD</text>
    
    <text x="120" y="165" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="16">STERILE GAUZE</text>
    <text x="120" y="185" fill="#64748b" font-family="sans-serif" font-size="12">Non-Woven 4-Ply 4"x4"</text>

    <!-- Gauze Texture Mockup -->
    <rect x="120" y="205" width="160" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4,4"/>
    <text x="200" y="245" fill="#059669" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">EO STERILIZED</text>
    <text x="200" y="265" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">50 Pouches Included</text>
  </g>
</svg>